target-version = "py311"
line-length = 100

src = [
    "desktop/python/repo_save_editor",
    "desktop/python/tests",
    "tools/capabilities",
]

extend-exclude = [
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[lint]
select = [
    "A",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "F",
    "I",
    "PERF",
    "PGH",
    "PIE",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = ["E501"]

[lint.mccabe]
max-complexity = 15

[lint.isort]
known-first-party = ["repo_save_editor"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true