target-version = "py311"
line-length = 100

src = [
    "desktop/python/repo_save_editor",
    "desktop/python/tests",
    "tools/capabilities",
]

extend-exclude = [
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[lint]
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "F",
    "I",
    "PERF",
    "PGH",
    "PIE",
    "PT",
    "RET",
    "RSE",
    "S",
    "RUF",
    "SIM",
    "TRY004",
    "UP",
    "W",
    "PLE",
    "PLC",
    "PLW",
    "ASYNC",
    "G",
    "LOG",
    "TRY201",
    "TRY203",
    "TRY400",
    "TRY401",
    "N",
    "PTH",
    "T10",
    "T20",
]
ignore = ["E501"]

[lint.per-file-ignores]
"tools/capabilities/workflow.py" = ["T201"]
"desktop/python/repo_save_editor/desktop_api/__main__.py" = ["T201"]
"desktop/python/tests/**/*.py" = ["S101"]
"tools/capabilities/tests/**/*.py" = ["S101"]

[lint.mccabe]
max-complexity = 15

[lint.isort]
known-first-party = ["repo_save_editor"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true