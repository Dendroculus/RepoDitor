[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-save-editor"
version = "0.2.1"
description = "A desktop save editor for R.E.P.O. .es3 save files."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hans Valerie"}
]
dependencies = [
    "cryptography>=43,<46",
]
keywords = ["repo", "save-editor", "es3", "unity", "easy-save-3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_save_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../tools/capabilities/tests"]
pythonpath = [".", "../.."]

[tool.mypy]
python_version = "3.11"
platform = "win32"
mypy_path = [".", "../.."]
files = ["repo_save_editor", "../../tools/capabilities"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
show_error_codes = true
show_error_context = true
pretty = true

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "ruff>=0.16.1",
]
test = [
    "pytest>=8.3,<9",
]
package = [
    "pyinstaller>=6,<7",
]
